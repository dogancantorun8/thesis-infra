# files/drift-webhook/k8s/serviceaccount.yaml
# ServiceAccount for the drift webhook Deployment.
# Bound to a Role in the kubeflow namespace (see rbac.yaml) so the
# webhook can list Argo Workflow CRs for the idempotency check.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: drift-webhook
  namespace: mlops
  labels:
    app: drift-webhook
    component: closed-loop-trigger
