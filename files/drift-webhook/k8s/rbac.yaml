# files/drift-webhook/k8s/rbac.yaml
# RBAC for drift-webhook ServiceAccount (mlops ns) to read Argo workflows
# in the kubeflow namespace. Needed for the "is a retraining workflow
# already running?" idempotency check.
#
# Pattern: Role (namespace-scoped) instead of ClusterRole — minimum
# privilege. Webhook never CREATES workflows directly; KFP API does that
# from inside the cluster.

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drift-webhook-workflows-reader
  namespace: kubeflow
  labels:
    app: drift-webhook
    component: closed-loop-trigger
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drift-webhook-workflows-reader
  namespace: kubeflow
  labels:
    app: drift-webhook
    component: closed-loop-trigger
subjects:
  - kind: ServiceAccount
    name: drift-webhook
    namespace: mlops
roleRef:
  kind: Role
  name: drift-webhook-workflows-reader
  apiGroup: rbac.authorization.k8s.io
