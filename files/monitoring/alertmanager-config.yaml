# files/monitoring/alertmanager-config.yaml
# Alertmanager routing configuration — merged into kube-prometheus-stack
# values under the `alertmanager.config` key.
#
# Goal: replace default "null" grouping with semantic alert grouping
# (by alertname + severity + service). Route ModelDriftDetected alerts
# specifically; other alerts get a fallback receiver.

global:
  resolve_timeout: 5m

# Top-level routing tree
route:
  # Default grouping — all alerts grouped by alertname, severity, service
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default-void'

  # Specific routes
  routes:
    # Model drift detection — high-priority alert from Evidently CronJob
    - matchers:
        - alertname = "ModelDriftDetected"
      receiver: 'model-drift'
      group_by: ['alertname', 'model_name', 'baseline_version', 'service']
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1h
      continue: true

    # Critical infrastructure alerts (from kube-prometheus-stack rules)
    - matchers:
        - severity = "critical"
      receiver: 'critical-void'
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      continue: true

# Receivers
# - default-void / critical-void: still no-ops (used as fallback)
# - model-drift: real webhook → drift-webhook in mlops ns (closed loop)
#                Triggers KFP retraining pipeline on every ModelDriftDetected fire.
receivers:
  - name: 'default-void'

  - name: 'model-drift'
    webhook_configs:
      - url: 'http://drift-webhook.mlops.svc.cluster.local:8080/webhook/drift'
        send_resolved: false       # We don't act on resolved drift; only on firing
        max_alerts: 1              # Submit one KFP run per alert group (idempotency
                                   # in webhook handles the rest — running workflow
                                   # check + 5-minute debounce)
        http_config:
          follow_redirects: true
          enable_http2: false      # KFP API is HTTP/1.1
        # No basic_auth / bearer_token — webhook accepts in-cluster traffic only
        # (NetworkPolicy + ServiceMonitor restrict access)

  - name: 'critical-void'

# Inhibition rules — silence lower-severity alerts when higher fires
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'namespace']

# Templates (none for now; future: custom HTML for Slack/email)
templates: []
